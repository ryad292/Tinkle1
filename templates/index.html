<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tinkle AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #010509;

    font-family:
        "Courier New",
        monospace;

}

canvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

}

#hud {

    position: fixed;

    left: 50%;

    bottom: 17px;

    transform:
        translateX(-50%);

    color: #00dfff;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:
        0 0 5px currentColor,
        0 0 15px currentColor,
        0 0 30px currentColor;

    pointer-events: none;

    z-index: 20;

    white-space: nowrap;

}

#status {

    position: fixed;

    top: 15px;

    left: 20px;

    color: #00dfff;

    font-size: 10px;

    letter-spacing: 2px;

    opacity: .8;

    pointer-events: none;

    z-index: 20;

}

#command {

    position: fixed;

    left: 50%;

    bottom: 48px;

    transform:
        translateX(-50%);

    color: #00dfff;

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .6;

    pointer-events: none;

    z-index: 20;

    white-space: nowrap;

}

</style>

</head>


<body>


<canvas id="tinkleCanvas"></canvas>


<div id="status">
    TINKLE AI // SYSTEM ONLINE
</div>


<div id="command">
    SYSTEM READY
</div>


<div id="hud">
    TINKLE DYNAMIC CORE
</div>


<script>


/* =========================================================
   TINKLE AI
   JARVIS / REACTOR INTERFACE
========================================================= */


const canvas =
    document.getElementById(
        "tinkleCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let width = 0;
let height = 0;

let centerX = 0;
let centerY = 0;

let time = 0;

let currentColor =
    "#00dfff";


/* =========================================================
   TINKLE STATE
========================================================= */

let tinkleState =
    "ready";


/*

ready
listening
thinking
processing
speaking
error

*/


let audioLevel = 0;

let targetAudioLevel = 0;


/* =========================================================
   STATE LABELS
========================================================= */

const stateLabels = {

    ready:
        "SYSTEM READY",

    listening:
        "LISTENING",

    thinking:
        "THINKING",

    processing:
        "PROCESSING",

    speaking:
        "TINKLE SPEAKING",

    error:
        "SYSTEM ERROR"

};



/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    centerX =
        width / 2;


    centerY =
        height / 2;

}


window.addEventListener(
    "resize",
    resize
);


resize();



/* =========================================================
   COLOR
========================================================= */

function setCoreColor(color) {

    if (!color)
        return;


    currentColor =
        color;


    document.getElementById(
        "hud"
    ).style.color =
        color;


    document.getElementById(
        "status"
    ).style.color =
        color;


    document.getElementById(
        "command"
    ).style.color =
        color;

}



/* =========================================================
   COLOR COMMAND
========================================================= */

window.changeTinkleColor =
function(command) {

    if (!command)
        return;


    command =
        String(command)
        .toLowerCase();


    if (
        command.includes("red") ||
        command.includes("أحمر") ||
        command.includes("احمر")
    ) {

        setCoreColor(
            "#ff3030"
        );

    }

    else if (
        command.includes("blue") ||
        command.includes("أزرق") ||
        command.includes("ازرق")
    ) {

        setCoreColor(
            "#00dfff"
        );

    }

    else if (
        command.includes("green") ||
        command.includes("أخضر") ||
        command.includes("اخضر")
    ) {

        setCoreColor(
            "#00ff70"
        );

    }

    else if (
        command.includes("purple") ||
        command.includes("بنفسجي")
    ) {

        setCoreColor(
            "#aa55ff"
        );

    }

    else if (
        command.includes("pink") ||
        command.includes("وردي")
    ) {

        setCoreColor(
            "#ff3399"
        );

    }

    else if (
        command.includes("gold") ||
        command.includes("ذهبي")
    ) {

        setCoreColor(
            "#ffaa00"
        );

    }

    else if (
        command.includes("orange") ||
        command.includes("برتقالي")
    ) {

        setCoreColor(
            "#ff6600"
        );

    }

    else if (
        command.includes("white") ||
        command.includes("أبيض") ||
        command.includes("ابيض")
    ) {

        setCoreColor(
            "#ffffff"
        );

    }

    else if (
        command.includes("cyan") ||
        command.includes("سماوي")
    ) {

        setCoreColor(
            "#00ffff"
        );

    }

};



/* =========================================================
   STATE SYSTEM
========================================================= */

window.setTinkleState =
function(state) {

    if (!state)
        return;


    state =
        String(state)
        .toLowerCase();


    const allowed = [

        "ready",
        "listening",
        "thinking",
        "processing",
        "speaking",
        "error"

    ];


    if (
        !allowed.includes(
            state
        )
    ) {

        return;

    }


    tinkleState =
        state;


    document.getElementById(
        "status"
    ).textContent =
        "TINKLE AI // " +
        stateLabels[state];


    document.getElementById(
        "command"
    ).textContent =
        stateLabels[state];

};



/* =========================================================
   SPEAKING
========================================================= */

window.tinkleStartSpeaking =
function() {

    window.setTinkleState(
        "speaking"
    );


    targetAudioLevel =
        .7;

};



window.tinkleStopSpeaking =
function() {

    targetAudioLevel =
        0;


    window.setTinkleState(
        "ready"
    );

};



/* =========================================================
   LISTENING
========================================================= */

window.tinkleStartListening =
function() {

    window.setTinkleState(
        "listening"
    );

};



window.tinkleStopListening =
function() {

    window.setTinkleState(
        "ready"
    );

};



/* =========================================================
   THINKING
========================================================= */

window.tinkleStartThinking =
function() {

    window.setTinkleState(
        "thinking"
    );

};



window.tinkleStopThinking =
function() {

    window.setTinkleState(
        "ready"
    );

};



/* =========================================================
   PROCESSING
========================================================= */

window.tinkleStartProcessing =
function() {

    window.setTinkleState(
        "processing"
    );

};



window.tinkleStopProcessing =
function() {

    window.setTinkleState(
        "ready"
    );

};



/* =========================================================
   ERROR
========================================================= */

window.tinkleError =
function(message) {

    window.setTinkleState(
        "error"
    );


    if (message) {

        document.getElementById(
            "command"
        ).textContent =
            String(message);

    }

};



/* =========================================================
   AUDIO LEVEL
========================================================= */

/*

القيمة من 0 إلى 1

0   = لا يوجد صوت
1   = صوت قوي

يمكن لـ Python إرسالها
كلما تغير مستوى الصوت.

*/


window.setTinkleAudioLevel =
function(level) {

    level =
        Number(level);


    if (
        Number.isNaN(level)
    ) {

        return;

    }


    targetAudioLevel =
        Math.max(
            0,
            Math.min(
                1,
                level
            )
        );

};



/* =========================================================
   LAST COMMAND
========================================================= */

window.setTinkleCommand =
function(command) {

    if (!command)
        return;


    document.getElementById(
        "command"
    ).textContent =
        String(command);

};



/* =========================================================
   EXTERNAL MESSAGE BRIDGE
========================================================= */

window.addEventListener(
    "message",
    function(event) {

        if (!event.data)
            return;


        const data =
            event.data;


        /*
         * COLOR
         */

        if (
            data.type ===
            "tinkle-color"
        ) {

            window.changeTinkleColor(
                data.color
            );

        }


        /*
         * COMMAND
         */

        if (
            data.type ===
            "tinkle-command"
        ) {

            window.setTinkleCommand(
                data.command
            );

        }


        /*
         * STATE
         */

        if (
            data.type ===
            "tinkle-state"
        ) {

            window.setTinkleState(
                data.state
            );

        }


        /*
         * SPEAKING
         */

        if (
            data.type ===
            "tinkle-speaking"
        ) {

            if (
                data.value
            ) {

                window.tinkleStartSpeaking();

            }

            else {

                window.tinkleStopSpeaking();

            }

        }


        /*
         * LISTENING
         */

        if (
            data.type ===
            "tinkle-listening"
        ) {

            if (
                data.value
            ) {

                window.tinkleStartListening();

            }

            else {

                window.tinkleStopListening();

            }

        }


        /*
         * THINKING
         */

        if (
            data.type ===
            "tinkle-thinking"
        ) {

            if (
                data.value
            ) {

                window.tinkleStartThinking();

            }

            else {

                window.tinkleStopThinking();

            }

        }


        /*
         * PROCESSING
         */

        if (
            data.type ===
            "tinkle-processing"
        ) {

            if (
                data.value
            ) {

                window.tinkleStartProcessing();

            }

            else {

                window.tinkleStopProcessing();

            }

        }


        /*
         * AUDIO
         */

        if (
            data.type ===
            "tinkle-audio"
        ) {

            window.setTinkleAudioLevel(
                data.level
            );

        }


        /*
         * ERROR
         */

        if (
            data.type ===
            "tinkle-error"
        ) {

            window.tinkleError(
                data.message
            );

        }

    }
);



/* =========================================================
   DRAW HELPERS
========================================================= */

function hexToRGBA(
    hex,
    alpha
) {

    hex =
        hex.replace(
            "#",
            ""
        );


    const r =
        parseInt(
            hex.substring(
                0,
                2
            ),
            16
        );


    const g =
        parseInt(
            hex.substring(
                2,
                4
            ),
            16
        );


    const b =
        parseInt(
            hex.substring(
                4,
                6
            ),
            16
        );


    return (
        "rgba(" +
        r + "," +
        g + "," +
        b + "," +
        alpha +
        ")"
    );

}



function line(
    x1,
    y1,
    x2,
    y2,
    alpha = 1,
    lineWidth = 1
) {

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            alpha
        );


    ctx.lineWidth =
        lineWidth;


    ctx.stroke();

}



function circle(
    x,
    y,
    radius,
    alpha = 1,
    lineWidth = 1
) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            alpha
        );


    ctx.lineWidth =
        lineWidth;


    ctx.stroke();

}



function fillCircle(
    x,
    y,
    radius,
    color,
    alpha = 1
) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        hexToRGBA(
            color,
            alpha
        );


    ctx.fill();

}



/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(
                width,
                height
            ) * .8

        );


    gradient.addColorStop(
        0,
        "#071c2a"
    );


    gradient.addColorStop(
        .4,
        "#020b13"
    );


    gradient.addColorStop(
        1,
        "#000205"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * GRID
     */

    ctx.strokeStyle =
        "rgba(30,130,170,.065)";


    ctx.lineWidth =
        1;


    const grid =
        36;


    for (
        let x = 0;
        x < width;
        x += grid
    ) {

        line(
            x,
            0,
            x,
            height,
            .08
        );

    }


    for (
        let y = 0;
        y < height;
        y += grid
    ) {

        line(
            0,
            y,
            width,
            y,
            .08
        );

    }

}



/* =========================================================
   PANELS
========================================================= */

function drawPanel(
    x,
    y,
    w,
    h,
    title
) {

    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .32
        );


    ctx.lineWidth =
        1;


    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .07
        );


    ctx.fillRect(
        x,
        y,
        w,
        22
    );


    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .75
        );


    ctx.font =
        "10px Courier New";


    ctx.fillText(
        title,
        x + 8,
        y + 15
    );


    /*
     * corners
     */

    line(
        x,
        y,
        x + 14,
        y,
        .8,
        2
    );


    line(
        x,
        y,
        x,
        y + 14,
        .8,
        2
    );


    line(
        x + w,
        y + h,
        x + w - 14,
        y + h,
        .8,
        2
    );


    line(
        x + w,
        y + h,
        x + w,
        y + h - 14,
        .8,
        2
    );

}



/* =========================================================
   GRAPH
========================================================= */

function drawGraph(
    x,
    y,
    w,
    h,
    seed
) {

    ctx.beginPath();


    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const px =
            x +
            (
                i / 99
            ) *
            w;


        const value =
            Math.sin(
                i * .32 +
                time * 2 +
                seed
            ) *
            .22
            +
            Math.sin(
                i * 1.3 +
                seed
            ) *
            .08;


        const py =
            y +
            h / 2 +
            value * h;


        if (
            i === 0
        ) {

            ctx.moveTo(
                px,
                py
            );

        }

        else {

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .7
        );


    ctx.lineWidth =
        1;


    ctx.stroke();

}



/* =========================================================
   PANELS
========================================================= */

function drawPanels() {

    if (
        width < 850
    )
        return;


    const left =
        18;


    const right =
        width - 218;


    const panelWidth =
        190;


    drawPanel(
        left,
        70,
        panelWidth,
        105,
        "SYSTEM CORE"
    );


    drawPanel(
        left,
        190,
        panelWidth,
        130,
        "CPU ANALYSIS"
    );


    drawPanel(
        left,
        335,
        panelWidth,
        105,
        "MEMORY"
    );


    drawPanel(
        right,
        70,
        panelWidth,
        125,
        "ENVIRONMENT"
    );


    drawPanel(
        right,
        210,
        panelWidth,
        110,
        "NETWORK"
    );


    drawPanel(
        right,
        335,
        panelWidth,
        105,
        "TINKLE STATUS"
    );


    /*
     * graphs
     */

    drawGraph(
        left + 10,
        235,
        panelWidth - 20,
        55,
        1
    );


    drawGraph(
        left + 10,
        355,
        panelWidth - 20,
        50,
        3
    );


    drawGraph(
        right + 10,
        235,
        panelWidth - 20,
        55,
        5
    );


    drawGraph(
        right + 10,
        355,
        panelWidth - 20,
        50,
        8
    );


    /*
     * text
     */

    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .7
        );


    ctx.font =
        "9px Courier New";


    ctx.fillText(
        "NEURAL CORE ACTIVE",
        left + 10,
        112
    );


    ctx.fillText(
        "VOICE ENGINE READY",
        left + 10,
        130
    );


    ctx.fillText(
        "MEMORY ONLINE",
        left + 10,
        148
    );


    ctx.fillText(
        "CPU  98.4%",
        left + 10,
        210
    );


    ctx.fillText(
        "LATENCY  12ms",
        left + 10,
        225
    );


    ctx.fillText(
        "MEMORY  42%",
        left + 10,
        355
    );


    ctx.fillText(
        "NETWORK STABLE",
        right + 10,
        110
    );


    ctx.fillText(
        "SECURE CHANNEL",
        right + 10,
        128
    );


    ctx.fillText(
        "SIGNAL  100%",
        right + 10,
        146
    );


    ctx.fillText(
        stateLabels[
            tinkleState
        ],
        right + 10,
        365
    );


    ctx.fillText(
        "AUDIO " +
        Math.round(
            audioLevel * 100
        ) +
        "%",
        right + 10,
        383
    );

}



/* =========================================================
   TOP HUD
========================================================= */

function drawTopHUD() {

    line(
        20,
        32,
        width - 20,
        32,
        .3
    );


    line(
        20,
        48,
        width * .32,
        48,
        .2
    );


    line(
        width * .68,
        48,
        width - 20,
        48,
        .2
    );


    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .7
        );


    ctx.font =
        "9px Courier New";


    ctx.fillText(
        "TINKLE // ARTIFICIAL INTELLIGENCE",
        25,
        24
    );


    ctx.fillText(
        "SECURE CHANNEL",
        width - 130,
        24
    );

}



/* =========================================================
   REACTOR
========================================================= */

function drawReactor() {

    /*
     * smooth audio reaction
     */

    audioLevel +=
        (
            targetAudioLevel -
            audioLevel
        ) *
        .12;


    const base =
        Math.min(
            width,
            height
        ) *
        .30;


    const cx =
        centerX;


    const cy =
        centerY;


    /*
     * state activity
     */

    let activity =
        audioLevel;


    if (
        tinkleState ===
        "listening"
    ) {

        activity =
            .18 +
            Math.sin(
                time * 4
            ) *
            .08;

    }


    if (
        tinkleState ===
        "thinking"
    ) {

        activity =
            .25 +
            Math.sin(
                time * 5
            ) *
            .10;

    }


    if (
        tinkleState ===
        "processing"
    ) {

        activity =
            .35 +
            Math.sin(
                time * 7
            ) *
            .12;

    }


    if (
        tinkleState ===
        "error"
    ) {

        activity =
            .8 +
            Math.sin(
                time * 12
            ) *
            .2;

    }


    /*
     * GLOBAL GLOW
     */

    const glowRadius =
        base *
        (
            1.3 +
            activity *
            .8
        );


    const glow =
        ctx.createRadialGradient(

            cx,
            cy,
            0,

            cx,
            cy,
            glowRadius

        );


    glow.addColorStop(
        0,
        hexToRGBA(
            currentColor,
            .25 +
            activity * .25
        )
    );


    glow.addColorStop(
        .35,
        hexToRGBA(
            currentColor,
            .08
        )
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        glowRadius,
        0,
        Math.PI * 2
    );


    ctx.fill();



    /*
     * OUTER RINGS
     */

    circle(
        cx,
        cy,
        base * 1.35,
        .30,
        1
    );


    circle(
        cx,
        cy,
        base * 1.24,
        .55,
        1
    );


    circle(
        cx,
        cy,
        base * 1.14,
        .30,
        2
    );


    circle(
        cx,
        cy,
        base * 1.05,
        .75,
        2
    );



    /*
     * ROTATING ARCS
     */

    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        time * .15
    );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        base * 1.35,
        -.7,
        .8
    );


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .85
        );


    ctx.lineWidth =
        4;


    ctx.stroke();


    ctx.restore();



    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        -time * .10
    );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        base * 1.23,
        2.2,
        4.0
    );


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .55
        );


    ctx.lineWidth =
        2;


    ctx.stroke();


    ctx.restore();



    /*
     * RADIAL TICKS
     */

    for (
        let i = 0;
        i < 72;
        i++
    ) {

        const angle =
            i /
            72 *
            Math.PI *
            2;


        const inner =
            base *
            (
                i % 3 === 0
                ? 1.04
                : 1.075
            );


        const outer =
            base *
            (
                i % 3 === 0
                ? 1.13
                : 1.105
            );


        line(

            cx +
            Math.cos(angle) *
            inner,

            cy +
            Math.sin(angle) *
            inner,

            cx +
            Math.cos(angle) *
            outer,

            cy +
            Math.sin(angle) *
            outer,

            i % 3 === 0
            ? .8
            : .35,

            i % 3 === 0
            ? 2
            : 1

        );

    }



    /*
     * INNER CIRCLES
     */

    circle(
        cx,
        cy,
        base * .91,
        .85,
        3
    );


    circle(
        cx,
        cy,
        base * .84,
        .5,
        1
    );



    /*
     * TRIANGLE
     */

    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    let triangleRotation =
        time * .04;


    if (
        tinkleState ===
        "thinking"
    ) {

        triangleRotation =
            time * .16;

    }


    if (
        tinkleState ===
        "processing"
    ) {

        triangleRotation =
            time * .28;

    }


    ctx.rotate(
        triangleRotation
    );


    const tri =
        base * .62;


    ctx.beginPath();


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const angle =
            -Math.PI / 2 +
            i *
            Math.PI *
            2 / 3;


        const x =
            Math.cos(angle) *
            tri;


        const y =
            Math.sin(angle) *
            tri;


        if (
            i === 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        }

        else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();


    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .05
        );


    ctx.fill();


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .95
        );


    ctx.lineWidth =
        5;


    ctx.shadowColor =
        currentColor;


    ctx.shadowBlur =
        15 +
        activity * 30;


    ctx.stroke();


    ctx.shadowBlur =
        0;


    /*
     * INNER TRIANGLE
     */

    ctx.beginPath();


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const angle =
            -Math.PI / 2 +
            i *
            Math.PI *
            2 / 3;


        const x =
            Math.cos(angle) *
            tri *
            .72;


        const y =
            Math.sin(angle) *
            tri *
            .72;


        if (
            i === 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        }

        else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();


    ctx.strokeStyle =
        hexToRGBA(
            currentColor,
            .4
        );


    ctx.lineWidth =
        2;


    ctx.stroke();


    ctx.restore();



    /*
     * CENTRAL CORE
     */

    const pulse =
        1 +
        Math.sin(
            time * 4
        ) *
        .10
        +
        activity *
        .45;


    const coreRadius =
        base *
        .13 *
        pulse;


    const coreGlow =
        ctx.createRadialGradient(

            cx,
            cy,
            0,

            cx,
            cy,
            coreRadius * 5

        );


    coreGlow.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );


    coreGlow.addColorStop(
        .10,
        "rgba(220,250,255,.98)"
    );


    coreGlow.addColorStop(
        .32,
        hexToRGBA(
            currentColor,
            .85
        )
    );


    coreGlow.addColorStop(
        .65,
        hexToRGBA(
            currentColor,
            .15
        )
    );


    coreGlow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        coreGlow;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        coreRadius * 5,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
     * white center
     */

    fillCircle(
        cx,
        cy,
        coreRadius,
        "#ffffff",
        1
    );



    /*
     * center ring
     */

    circle(
        cx,
        cy,
        base * .20,
        .65,
        1
    );



    /*
     * ENERGY MARKERS
     */

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const angle =
            time *
            (
                .25 +
                activity
            ) +
            i *
            Math.PI *
            2 /
            12;


        const r =
            base * .73;


        fillCircle(

            cx +
            Math.cos(angle) *
            r,

            cy +
            Math.sin(angle) *
            r,

            3 +
            activity * 2,

            currentColor,

            .75 +
            activity * .2

        );

    }



    /*
     * LABELS
     */

    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .7
        );


    ctx.font =
        "8px Courier New";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "NEURAL CORE",
        cx,
        cy - base * .72
    );


    ctx.fillText(
        "TINKLE",
        cx,
        cy + base * .75
    );


    ctx.textAlign =
        "left";

}



/* =========================================================
   PARTICLES
========================================================= */

const particles = [];


for (
    let i = 0;
    i < 200;
    i++
) {

    particles.push({

        angle:
            Math.random() *
            Math.PI *
            2,

        radius:
            170 +
            Math.random() *
            260,

        speed:
            .0002 +
            Math.random() *
            .001,

        size:
            1 +
            Math.random() *
            2,

        alpha:
            .2 +
            Math.random() *
            .7

    });

}



function drawParticles() {

    for (
        const p of particles
    ) {

        p.angle +=
            p.speed *
            16 *
            (
                1 +
                audioLevel
            );


        const x =
            centerX +
            Math.cos(
                p.angle
            ) *
            p.radius;


        const y =
            centerY +
            Math.sin(
                p.angle
            ) *
            p.radius *
            .58;


        fillCircle(

            x,
            y,

            p.size +
            audioLevel,

            currentColor,

            p.alpha

        );

    }

}



/* =========================================================
   DATA MARKERS
========================================================= */

function drawDataMarkers() {

    const base =
        Math.min(
            width,
            height
        ) *
        .30;


    const radius =
        base * 1.48;


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            i /
            18 *
            Math.PI *
            2;


        const x =
            centerX +
            Math.cos(angle) *
            radius;


        const y =
            centerY +
            Math.sin(angle) *
            radius;


        const size =
            i % 2 === 0
            ? 8
            : 4;


        ctx.strokeStyle =
            hexToRGBA(
                currentColor,
                .4
            );


        ctx.strokeRect(
            x - size,
            y - size,
            size * 2,
            size * 2
        );

    }

}



/* =========================================================
   BOTTOM BAR
========================================================= */

function drawBottomBar() {

    const y =
        height - 48;


    line(
        20,
        y,
        width - 20,
        y,
        .3
    );


    ctx.fillStyle =
        hexToRGBA(
            currentColor,
            .65
        );


    ctx.font =
        "9px Courier New";


    ctx.fillText(
        "TINKLE OS",
        25,
        y + 18
    );


    ctx.fillText(
        "VOICE",
        110,
        y + 18
    );


    ctx.fillText(
        "VISION",
        170,
        y + 18
    );


    ctx.fillText(
        "MEMORY",
        240,
        y + 18
    );


    ctx.fillText(
        "NLP",
        315,
        y + 18
    );


    ctx.fillText(
        "SYSTEM READY",
        width - 130,
        y + 18
    );

}



/* =========================================================
   MOUSE
========================================================= */

let isDragging =
    false;


let previousMousePos = {

    x: 0,
    y: 0

};


let rotationX = 0;
let rotationY = 0;


window.addEventListener(
    "mousedown",
    function(e) {

        isDragging =
            true;


        previousMousePos = {

            x:
                e.clientX,

            y:
                e.clientY

        };

    }
);


window.addEventListener(
    "mousemove",
    function(e) {

        if (!isDragging)
            return;


        rotationY +=
            (
                e.clientX -
                previousMousePos.x
            ) *
            .002;


        rotationX +=
            (
                e.clientY -
                previousMousePos.y
            ) *
            .002;


        previousMousePos = {

            x:
                e.clientX,

            y:
                e.clientY

        };

    }
);


window.addEventListener(
    "mouseup",
    function() {

        isDragging =
            false;

    }
);



/* =========================================================
   TOUCH
========================================================= */

window.addEventListener(
    "touchstart",
    function(e) {

        isDragging =
            true;


        previousMousePos = {

            x:
                e.touches[0].clientX,

            y:
                e.touches[0].clientY

        };

    }
);


window.addEventListener(
    "touchmove",
    function(e) {

        if (!isDragging)
            return;


        rotationY +=
            (
                e.touches[0].clientX -
                previousMousePos.x
            ) *
            .002;


        rotationX +=
            (
                e.touches[0].clientY -
                previousMousePos.y
            ) *
            .002;


        previousMousePos = {

            x:
                e.touches[0].clientX,

            y:
                e.touches[0].clientY

        };

    }
);


window.addEventListener(
    "touchend",
    function() {

        isDragging =
            false;

    }
);



/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    time =
        performance.now() *
        .001;


    /*
     * background
     */

    drawBackground();


    /*
     * HUD
     */

    drawTopHUD();


    /*
     * panels
     */

    drawPanels();


    /*
     * reactor
     */

    drawReactor();


    /*
     * particles
     */

    drawParticles();


    /*
     * markers
     */

    drawDataMarkers();


    /*
     * bottom
     */

    drawBottomBar();

}


animate();



/* =========================================================
   DEFAULT STATE
========================================================= */

setCoreColor(
    "#00dfff"
);


window.setTinkleState(
    "ready"
);



/* =========================================================
   DEBUG / TEST API

   يمكنك تجربتها من Console
========================================================= */

window.TinkleUI = {

    ready() {

        window.setTinkleState(
            "ready"
        );

    },


    listening() {

        window.setTinkleState(
            "listening"
        );

    },


    thinking() {

        window.setTinkleState(
            "thinking"
        );

    },


    processing() {

        window.setTinkleState(
            "processing"
        );

    },


    speaking() {

        window.tinkleStartSpeaking();

    },


    stopSpeaking() {

        window.tinkleStopSpeaking();

    },


    error(message) {

        window.tinkleError(
            message
        );

    },


    color(color) {

        window.changeTinkleColor(
            color
        );

    },


    audio(level) {

        window.setTinkleAudioLevel(
            level
        );

    },


    command(command) {

        window.setTinkleCommand(
            command
        );

    }

};


</script>
