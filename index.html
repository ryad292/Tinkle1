<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tinkle AI - Advanced JARVIS Hologram</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010308;
            font-family: 'Courier New', Courier, monospace;
        }
        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ffaa00;
            font-size: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 170, 0, 0.9);
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">TINKLE - CORE INTELLECT ACTIVE - YES, DOCTOR</div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();

        // 1. الطبقة الداخلية: نواة مضيئة متوهجة
        const coreGeo = new THREE.SphereGeometry(1.5, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true, transparent: true, opacity: 0.8 });
        const coreSphere = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(coreSphere);

        // 2. الطبقة الوسطى: شبكة الكرات المعقدة المتداخلة (تعطي كثافة جارفيس)
        const denseGeo = new THREE.IcosahedronGeometry(2.8, 3);
        const denseMat = new THREE.MeshBasicMaterial({ color: 0xff8800, wireframe: true, transparent: true, opacity: 0.25 });
        const denseSphere = new THREE.Mesh(denseGeo, denseMat);
        coreGroup.add(denseSphere);

        // 3. طبقة الجسيمات والنقاط الضوئية العشوائية المحيطة
        const particlesCount = 1000;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 3.2 + Math.random() * 1.2; // توزيع النقاط بشكل كروي عميق

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.05, transparent: true, opacity: 0.7 });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        coreGroup.add(particleSystem);

        // 4. الحلقات التقنية الخارجية الدائرة بعكس الاتجاه
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, wireframe: true, transparent: true, opacity: 0.6 });
        const ring1 = new THREE.Mesh(new THREE.RingGeometry(3.8, 4.0, 64), ringMat1);
        ring1.rotation.x = Math.PI / 3;
        coreGroup.add(ring1);

        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, wireframe: true, transparent: true, opacity: 0.5 });
        const ring2 = new THREE.Mesh(new THREE.RingGeometry(4.3, 4.45, 64), ringMat2);
        ring2.rotation.y = Math.PI / 4;
        coreGroup.add(ring2);

        scene.add(coreGroup);
        camera.position.z = 7;

        // التفاعل مع الماوس أو اللمس لتدوير المجسم بسلاسة
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.clientX - prevMousePos.x) * 0.005;
            coreGroup.rotation.x += (e.clientY - prevMousePos.y) * 0.005;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // دعم اللمس للـ ChromeOS
        window.addEventListener('touchstart', (e) => { isDragging = true; prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.touches[0].clientX - prevMousePos.x) * 0.005;
            coreGroup.rotation.x += (e.touches[0].clientY - prevMousePos.y) * 0.005;
            prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        // حركة دوران متقدمة ومتعددة الاتجاهات تشبه الحقيقة
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                coreGroup.rotation.y += 0.004;
                coreGroup.rotation.z += 0.001;
            }
            ring1.rotation.z -= 0.01;
            ring2.rotation.z += 0.015;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
