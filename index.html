<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tinkle AI - Dynamic Color Hologram</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010308;
            font-family: 'Courier New', Courier, monospace;
        }
        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #00dfff;
            font-size: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 223, 255, 0.8);
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">TINKLE DYNAMIC CORE - YES, DOCTOR</div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();

        // 1. النواة المضيئة في المنتصف
        const coreGeo = new THREE.SphereGeometry(0.55, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 1.0
        });
        const coreSphere = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(coreSphere);

        // 2. هالة مضيئة حول النواة
        const glowGeo = new THREE.SphereGeometry(0.85, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x00dfff,
            transparent: true,
            opacity: 0.16,
            wireframe: true
        });
        const glowSphere = new THREE.Mesh(glowGeo, glowMat);
        coreGroup.add(glowSphere);

        // 3. مدارات الطاقة السماوية
        const orbitMat = new THREE.LineBasicMaterial({
            color: 0x00dfff,
            transparent: true,
            opacity: 0.42
        });

        const orbitGeo1 = new THREE.RingGeometry(1.4, 1.43, 128);
        const ring1 = new THREE.Mesh(orbitGeo1, orbitMat);
        ring1.rotation.x = Math.PI * 0.48;
        ring1.rotation.y = Math.PI * 0.18;
        coreGroup.add(ring1);

        const orbitGeo2 = new THREE.RingGeometry(1.75, 1.78, 128);
        const ring2 = new THREE.Mesh(orbitGeo2, orbitMat);
        ring2.rotation.x = Math.PI * 0.72;
        ring2.rotation.z = Math.PI * 0.28;
        coreGroup.add(ring2);

        const extraOrbits = [];
        for (let i = 0; i < 5; i++) {
            const radius = 1.45 + Math.random() * 0.9;
            const orbitGeo = new THREE.RingGeometry(radius, radius + 0.025, 128);
            const orbit = new THREE.Mesh(orbitGeo, orbitMat);
            orbit.rotation.x = Math.random() * Math.PI;
            orbit.rotation.y = Math.random() * Math.PI;
            orbit.rotation.z = Math.random() * Math.PI;
            coreGroup.add(orbit);
            extraOrbits.push(orbit);
        }

        // 4. جسيمات صغيرة تتحرك حول النواة
        const particlesCount = 1800;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.7 + Math.random() * 2.1;
            const spread = (Math.random() - 0.5) * 1.1;

            positions[i] = Math.cos(angle) * radius;
            positions[i + 1] = Math.sin(angle) * radius * 0.55 + spread;
            positions[i + 2] = (Math.random() - 0.5) * 2.5;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({
            color: 0x00dfff,
            size: 0.045,
            transparent: true,
            opacity: 0.7
        });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        coreGroup.add(particleSystem);

        // 5. جسيمات صغيرة إضافية متناثرة حول الكرة
        const outerCount = 700;
        const outerGeo = new THREE.BufferGeometry();
        const outerPositions = new Float32Array(outerCount * 3);

        for (let i = 0; i < outerCount * 3; i += 3) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2.5 + Math.random() * 2.0;

            outerPositions[i] = Math.cos(angle) * radius;
            outerPositions[i + 1] = Math.sin(angle) * radius;
            outerPositions[i + 2] = (Math.random() - 0.5) * 3.5;
        }

        outerGeo.setAttribute('position', new THREE.BufferAttribute(outerPositions, 3));
        const outerMat = new THREE.PointsMaterial({
            color: 0x00bfff,
            size: 0.035,
            transparent: true,
            opacity: 0.55
        });
        const outerParticles = new THREE.Points(outerGeo, outerMat);
        coreGroup.add(outerParticles);

        scene.add(coreGroup);
        camera.position.z = 5;

        // دالة تغيير اللون ديناميكياً (تستقبل كود اللون مثل 0xffaa00 أو '#ff0000')
        window.changeHologramColor = function(hexColor) {
            const newColor = new THREE.Color(hexColor);
            glowMat.color = newColor;
            orbitMat.color = newColor;
            particlesMat.color = newColor;
            outerMat.color = newColor;
            
            // تغيير لون نصوص الـ HUD ليطابق لون الهولوغرام
            document.getElementById('hud').style.color = '#' + newColor.getHexString();
            document.getElementById('hud').style.textShadow = '0 0 20px #' + newColor.getHexString();
        };

        // تفاعل الماوس واللمس لتذوير المجسم
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.clientX - prevMousePos.x) * 0.005;
            coreGroup.rotation.x += (e.clientY - prevMousePos.y) * 0.005;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('touchstart', (e) => { isDragging = true; prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            coreGroup.rotation.y += (e.touches[0].clientX - prevMousePos.x) * 0.005;
            coreGroup.rotation.x += (e.touches[0].clientY - prevMousePos.y) * 0.005;
            prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                coreGroup.rotation.y += 0.004;
                coreGroup.rotation.z += 0.001;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
