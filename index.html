<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tinkle AI - Dynamic Core</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010308;
            font-family: 'Courier New', Courier, monospace;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #00dfff;
            font-size: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 220, 255, 0.9);
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="hud">
    TINKLE DYNAMIC CORE - YES, DOCTOR
</div>

<script>

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );


    const coreGroup = new THREE.Group();


    // =========================================================
    // CORE
    // =========================================================

    const coreGeo =
        new THREE.SphereGeometry(
            0.42,
            32,
            32
        );

    const coreMat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const coreSphere =
        new THREE.Mesh(
            coreGeo,
            coreMat
        );

    coreGroup.add(
        coreSphere
    );


    // =========================================================
    // HALO
    // =========================================================

    const haloGeo =
        new THREE.SphereGeometry(
            0.68,
            32,
            32
        );

    const haloMat =
        new THREE.MeshBasicMaterial({
            color: 0x00cfff,
            wireframe: true,
            transparent: true,
            opacity: 0.22
        });

    const halo =
        new THREE.Mesh(
            haloGeo,
            haloMat
        );

    coreGroup.add(
        halo
    );


    // =========================================================
    // ORBITS
    // =========================================================

    const orbitMaterial =
        new THREE.LineBasicMaterial({
            color: 0x00cfff,
            transparent: true,
            opacity: 0.42
        });

    const orbits = [];

    for (let i = 0; i < 7; i++) {

        const points = [];

        const radius =
            1.25 +
            Math.random() * 0.45;

        const height =
            0.55 +
            Math.random() * 0.55;

        for (let j = 0; j <= 160; j++) {

            const t =
                (j / 160) *
                Math.PI *
                2;

            const x =
                Math.cos(t) *
                radius;

            const y =
                Math.sin(t) *
                radius *
                height;

            const z =
                Math.sin(t) *
                radius *
                0.35;

            points.push(
                new THREE.Vector3(
                    x,
                    y,
                    z
                )
            );
        }

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const orbit =
            new THREE.Line(
                geometry,
                orbitMaterial
            );

        orbit.rotation.x =
            Math.random() * Math.PI;

        orbit.rotation.y =
            Math.random() * Math.PI;

        orbit.rotation.z =
            Math.random() * Math.PI;

        coreGroup.add(
            orbit
        );

        orbits.push(
            orbit
        );
    }


    // =========================================================
    // PARTICLES
    // =========================================================

    const particlesCount = 2600;

    const particlesGeo =
        new THREE.BufferGeometry();

    const positions =
        new Float32Array(
            particlesCount * 3
        );

    for (
        let i = 0;
        i < particlesCount;
        i++
    ) {

        const i3 = i * 3;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            0.9 +
            Math.pow(
                Math.random(),
                1.8
            ) * 2.2;

        const vertical =
            (Math.random() - 0.5) *
            distance *
            0.75;

        positions[i3] =
            Math.cos(angle) *
            distance +
            (Math.random() - 0.5) *
            0.22;

        positions[i3 + 1] =
            Math.sin(angle) *
            distance *
            0.72 +
            vertical *
            0.25;

        positions[i3 + 2] =
            vertical;
    }

    particlesGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const particlesMaterial =
        new THREE.PointsMaterial({
            color: 0x00cfff,
            size: 0.035,
            transparent: true,
            opacity: 0.72
        });

    const particles =
        new THREE.Points(
            particlesGeo,
            particlesMaterial
        );

    coreGroup.add(
        particles
    );


    // =========================================================
    // BRIGHT PARTICLES
    // =========================================================

    const brightCount = 350;

    const brightGeo =
        new THREE.BufferGeometry();

    const brightPositions =
        new Float32Array(
            brightCount * 3
        );

    for (
        let i = 0;
        i < brightCount;
        i++
    ) {

        const i3 = i * 3;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            1.0 +
            Math.random() *
            2.0;

        brightPositions[i3] =
            Math.cos(angle) *
            distance;

        brightPositions[i3 + 1] =
            Math.sin(angle) *
            distance *
            0.72;

        brightPositions[i3 + 2] =
            (Math.random() - 0.5) *
            distance;
    }

    brightGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(
            brightPositions,
            3
        )
    );

    const brightMaterial =
        new THREE.PointsMaterial({
            color: 0x66eaff,
            size: 0.065,
            transparent: true,
            opacity: 0.85
        });

    const brightParticles =
        new THREE.Points(
            brightGeo,
            brightMaterial
        );

    coreGroup.add(
        brightParticles
    );


    // =========================================================
    // ADD TO SCENE
    // =========================================================

    scene.add(
        coreGroup
    );

    camera.position.z = 7;


    // =========================================================
    // COLOR SYSTEM
    // =========================================================

    function setCoreColor(color) {

        const c =
            new THREE.Color(color);

        coreMat.color.set(c);

        haloMat.color.set(c);

        orbitMaterial.color.set(c);

        particlesMaterial.color.set(c);

        brightMaterial.color.set(c);

        document.getElementById(
            "hud"
        ).style.color =
            "#" + c.getHexString();
    }


    // =========================================================
    // TINKLE COLOR COMMAND
    // =========================================================

    window.changeTinkleColor =
        function(command) {

            if (!command)
                return;

            command =
                command.toLowerCase();


            if (
                command.includes("red") ||
                command.includes("أحمر") ||
                command.includes("احمر")
            ) {
                setCoreColor(
                    0xff2020
                );
            }

            else if (
                command.includes("blue") ||
                command.includes("أزرق") ||
                command.includes("ازرق")
            ) {
                setCoreColor(
                    0x00cfff
                );
            }

            else if (
                command.includes("green") ||
                command.includes("أخضر") ||
                command.includes("اخضر")
            ) {
                setCoreColor(
                    0x00ff66
                );
            }

            else if (
                command.includes("purple") ||
                command.includes("بنفسجي")
            ) {
                setCoreColor(
                    0xaa44ff
                );
            }

            else if (
                command.includes("pink") ||
                command.includes("وردي")
            ) {
                setCoreColor(
                    0xff3399
                );
            }

            else if (
                command.includes("gold") ||
                command.includes("ذهبي")
            ) {
                setCoreColor(
                    0xffaa00
                );
            }

            else if (
                command.includes("orange") ||
                command.includes("برتقالي")
            ) {
                setCoreColor(
                    0xff6600
                );
            }

            else if (
                command.includes("white") ||
                command.includes("أبيض") ||
                command.includes("ابيض")
            ) {
                setCoreColor(
                    0xffffff
                );
            }

            else if (
                command.includes("cyan") ||
                command.includes("سماوي")
            ) {
                setCoreColor(
                    0x00ffff
                );
            }
        };


    // =========================================================
    // EXTERNAL COMMAND SUPPORT
    // =========================================================

    window.addEventListener(
        "message",
        function(event) {

            if (!event.data)
                return;

            if (
                event.data.type ===
                "tinkle-color"
            ) {

                window.changeTinkleColor(
                    event.data.color
                );
            }

            if (
                event.data.type ===
                "tinkle-command"
            ) {

                window.changeTinkleColor(
                    event.data.command
                );
            }
        }
    );


    // =========================================================
    // MOUSE CONTROL
    // =========================================================

    let isDragging = false;

    let prevMousePos = {
        x: 0,
        y: 0
    };


    window.addEventListener(
        "mousedown",
        (e) => {

            isDragging = true;

            prevMousePos = {
                x: e.clientX,
                y: e.clientY
            };
        }
    );


    window.addEventListener(
        "mousemove",
        (e) => {

            if (!isDragging)
                return;

            coreGroup.rotation.y +=
                (e.clientX -
                    prevMousePos.x) *
                0.005;

            coreGroup.rotation.x +=
                (e.clientY -
                    prevMousePos.y) *
                0.005;

            prevMousePos = {
                x: e.clientX,
                y: e.clientY
            };
        }
    );


    window.addEventListener(
        "mouseup",
        () => {

            isDragging = false;

        }
    );


    // =========================================================
    // TOUCH CONTROL
    // =========================================================

    window.addEventListener(
        "touchstart",
        (e) => {

            isDragging = true;

            prevMousePos = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }
    );


    window.addEventListener(
        "touchmove",
        (e) => {

            if (!isDragging)
                return;

            coreGroup.rotation.y +=
                (
                    e.touches[0].clientX -
                    prevMousePos.x
                ) * 0.005;

            coreGroup.rotation.x +=
                (
                    e.touches[0].clientY -
                    prevMousePos.y
                ) * 0.005;

            prevMousePos = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }
    );


    window.addEventListener(
        "touchend",
        () => {

            isDragging = false;

        }
    );


    // =========================================================
    // ANIMATION
    // =========================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        if (!isDragging) {

            coreGroup.rotation.y +=
                0.004;

            coreGroup.rotation.z +=
                0.001;
        }

        if (orbits[0])
            orbits[0].rotation.z -=
                0.01;

        if (orbits[1])
            orbits[1].rotation.z +=
                0.015;

        renderer.render(
            scene,
            camera
        );
    }

    animate();


    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );

</script>

</body>
</html>
