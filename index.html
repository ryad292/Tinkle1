<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkle AI - Dynamic Core</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010308;
            font-family: 'Courier New', Courier, monospace;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #00dfff;
            font-size: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 220, 255, 0.9);
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="hud">
    TINKLE DYNAMIC CORE - YES, DOCTOR
</div>

<script>

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    const coreGroup = new THREE.Group();


    // =========================================================
    // PROFESSIONAL TINKLE CORE
    // =========================================================

    // Soft glow texture
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = 128;
    glowCanvas.height = 128;

    const glowCtx = glowCanvas.getContext("2d");

    const gradient = glowCtx.createRadialGradient(
        64, 64, 0,
        64, 64, 64
    );

    gradient.addColorStop(0.00, "rgba(255,255,255,1)");
    gradient.addColorStop(0.12, "rgba(180,250,255,0.95)");
    gradient.addColorStop(0.35, "rgba(0,210,255,0.55)");
    gradient.addColorStop(0.70, "rgba(0,170,255,0.15)");
    gradient.addColorStop(1.00, "rgba(0,120,255,0)");

    glowCtx.fillStyle = gradient;
    glowCtx.fillRect(0, 0, 128, 128);

    const glowTexture =
        new THREE.CanvasTexture(glowCanvas);


    // =========================================================
    // CORE
    // =========================================================

    const coreGeo =
        new THREE.SphereGeometry(
            0.34,
            32,
            32
        );

    const coreMat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const coreSphere =
        new THREE.Mesh(
            coreGeo,
            coreMat
        );

    coreGroup.add(coreSphere);


    // =========================================================
    // SOFT CORE GLOW
    // =========================================================

    const coreGlowMat =
        new THREE.SpriteMaterial({
            map: glowTexture,
            color: 0x00dfff,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

    const coreGlow =
        new THREE.Sprite(
            coreGlowMat
        );

    coreGlow.scale.set(
        1.35,
        1.35,
        1
    );

    coreGroup.add(coreGlow);


    // =========================================================
    // ENERGY ORBITS
    // =========================================================

    const orbitMaterial =
        new THREE.LineBasicMaterial({
            color: 0x00dfff,
            transparent: true,
            opacity: 0.38,
            blending: THREE.AdditiveBlending
        });

    const orbits = [];

    for (let i = 0; i < 7; i++) {

        const points = [];

        const radius =
            1.05 +
            Math.random() * 0.65;

        const verticalScale =
            0.45 +
            Math.random() * 0.45;

        for (let j = 0; j <= 220; j++) {

            const t =
                (j / 220) *
                Math.PI *
                2;

            const x =
                Math.cos(t) *
                radius;

            const y =
                Math.sin(t) *
                radius *
                verticalScale;

            const z =
                Math.sin(t * 2) *
                0.18;

            points.push(
                new THREE.Vector3(
                    x,
                    y,
                    z
                )
            );
        }

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const orbit =
            new THREE.Line(
                geometry,
                orbitMaterial
            );

        orbit.rotation.x =
            Math.random() * Math.PI;

        orbit.rotation.y =
            Math.random() * Math.PI;

        orbit.rotation.z =
            Math.random() * Math.PI;

        coreGroup.add(
            orbit
        );

        orbits.push(
            orbit
        );
    }


    // =========================================================
    // MAIN SOFT PARTICLES
    // =========================================================

    const particlesCount = 2200;

    const particlesGeo =
        new THREE.BufferGeometry();

    const positions =
        new Float32Array(
            particlesCount * 3
        );

    for (
        let i = 0;
        i < particlesCount;
        i++
    ) {

        const i3 = i * 3;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const radius =
            0.9 +
            Math.pow(
                Math.random(),
                1.7
            ) * 2.4;

        positions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        positions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        positions[i3 + 2] =
            radius *
            Math.cos(phi);
    }

    particlesGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const particlesMaterial =
        new THREE.PointsMaterial({
            map: glowTexture,
            color: 0x00cfff,
            size: 0.11,
            transparent: true,
            opacity: 0.72,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

    const particles =
        new THREE.Points(
            particlesGeo,
            particlesMaterial
        );

    coreGroup.add(
        particles
    );


    // =========================================================
    // SMALLER DISTANT PARTICLES
    // =========================================================

    const distantCount = 900;

    const distantGeo =
        new THREE.BufferGeometry();

    const distantPositions =
        new Float32Array(
            distantCount * 3
        );

    for (
        let i = 0;
        i < distantCount;
        i++
    ) {

        const i3 = i * 3;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const radius =
            2.1 +
            Math.random() * 1.8;

        distantPositions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        distantPositions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        distantPositions[i3 + 2] =
            radius *
            Math.cos(phi);
    }

    distantGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            distantPositions,
            3
        )
    );

    const distantMaterial =
        new THREE.PointsMaterial({
            map: glowTexture,
            color: 0x00bfff,
            size: 0.07,
            transparent: true,
            opacity: 0.45,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

    const distantParticles =
        new THREE.Points(
            distantGeo,
            distantMaterial
        );

    coreGroup.add(
        distantParticles
    );


    // =========================================================
    // BRIGHT ENERGY PARTICLES
    // =========================================================

    const brightCount = 280;

    const brightGeo =
        new THREE.BufferGeometry();

    const brightPositions =
        new Float32Array(
            brightCount * 3
        );

    for (
        let i = 0;
        i < brightCount;
        i++
    ) {

        const i3 = i * 3;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const radius =
            0.9 +
            Math.random() * 1.8;

        brightPositions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        brightPositions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        brightPositions[i3 + 2] =
            radius *
            Math.cos(phi);
    }

    brightGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            brightPositions,
            3
        )
    );

    const brightMaterial =
        new THREE.PointsMaterial({
            map: glowTexture,
            color: 0x9ff8ff,
            size: 0.16,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

    const brightParticles =
        new THREE.Points(
            brightGeo,
            brightMaterial
        );

    coreGroup.add(
        brightParticles
    );


    // Keep original ring names for animation compatibility
    const ring1 = orbits[0];
    const ring2 = orbits[1];


    // =========================================================
    // ADD TO SCENE
    // =========================================================

    scene.add(coreGroup);

    camera.position.z = 7;


    // =========================================================
    // COLOR SYSTEM
    // =========================================================

    function setCoreColor(color) {

        const c =
            new THREE.Color(color);

        coreMat.color.set(c);

        coreGlowMat.color.set(c);

        orbitMaterial.color.set(c);

        particlesMaterial.color.set(c);

        distantMaterial.color.set(c);

        brightMaterial.color.set(c);

        document.getElementById(
            "hud"
        ).style.color =
            "#" + c.getHexString();
    }


    // =========================================================
    // TINKLE COLOR COMMAND
    // =========================================================

    window.changeTinkleColor =
        function(command) {

            if (!command)
                return;

            command =
                command.toLowerCase();

            if (
                command.includes("red") ||
                command.includes("أحمر") ||
                command.includes("احمر")
            ) {
                setCoreColor(0xff2020);
            }

            else if (
                command.includes("blue") ||
                command.includes("أزرق") ||
                command.includes("ازرق")
            ) {
                setCoreColor(0x00cfff);
            }

            else if (
                command.includes("green") ||
                command.includes("أخضر") ||
                command.includes("اخضر")
            ) {
                setCoreColor(0x00ff66);
            }

            else if (
                command.includes("purple") ||
                command.includes("بنفسجي")
            ) {
                setCoreColor(0xaa44ff);
            }

            else if (
                command.includes("pink") ||
                command.includes("وردي")
            ) {
                setCoreColor(0xff3399);
            }

            else if (
                command.includes("gold") ||
                command.includes("ذهبي")
            ) {
                setCoreColor(0xffaa00);
            }

            else if (
                command.includes("orange") ||
                command.includes("برتقالي")
            ) {
                setCoreColor(0xff6600);
            }

            else if (
                command.includes("white") ||
                command.includes("أبيض") ||
                command.includes("ابيض")
            ) {
                setCoreColor(0xffffff);
            }

            else if (
                command.includes("cyan") ||
                command.includes("سماوي")
            ) {
                setCoreColor(0x00ffff);
            }
        };


    // =========================================================
    // EXTERNAL COMMAND SUPPORT
    // =========================================================

    window.addEventListener(
        "message",
        function(event) {

            if (!event.data)
                return;

            if (
                event.data.type ===
                "tinkle-color"
            ) {

                window.changeTinkleColor(
                    event.data.color
                );
            }

            if (
                event.data.type ===
                "tinkle-command"
            ) {

                window.changeTinkleColor(
                    event.data.command
                );
            }
        }
    );


    // =========================================================
    // MOUSE CONTROL
    // =========================================================

    let isDragging = false;

    let prevMousePos = {
        x: 0,
        y: 0
    };

    window.addEventListener(
        "mousedown",
        (e) => {

            isDragging = true;

            prevMousePos = {
                x: e.clientX,
                y: e.clientY
            };
        }
    );

    window.addEventListener(
        "mousemove",
        (e) => {

            if (!isDragging)
                return;

            coreGroup.rotation.y +=
                (e.clientX -
                    prevMousePos.x) *
                0.005;

            coreGroup.rotation.x +=
                (e.clientY -
                    prevMousePos.y) *
                0.005;

            prevMousePos = {
                x: e.clientX,
                y: e.clientY
            };
        }
    );

    window.addEventListener(
        "mouseup",
        () => {
            isDragging = false;
        }
    );


    // =========================================================
    // TOUCH CONTROL
    // =========================================================

    window.addEventListener(
        "touchstart",
        (e) => {

            isDragging = true;

            prevMousePos = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }
    );

    window.addEventListener(
        "touchmove",
        (e) => {

            if (!isDragging)
                return;

            coreGroup.rotation.y +=
                (
                    e.touches[0].clientX -
                    prevMousePos.x
                ) * 0.005;

            coreGroup.rotation.x +=
                (
                    e.touches[0].clientY -
                    prevMousePos.y
                ) * 0.005;

            prevMousePos = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }
    );

    window.addEventListener(
        "touchend",
        () => {
            isDragging = false;
        }
    );


    // =========================================================
    // ANIMATION
    // =========================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        if (!isDragging) {

            coreGroup.rotation.y +=
                0.004;

            coreGroup.rotation.z +=
                0.001;
        }

        if (ring1)
            ring1.rotation.z -=
                0.01;

        if (ring2)
            ring2.rotation.z +=
                0.015;

        renderer.render(
            scene,
            camera
        );
    }

    animate();


    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );

</script>

</body>
</html>
