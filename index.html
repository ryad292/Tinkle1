<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tinkle AI Core</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #06151d 0%,
            #02070c 35%,
            #000207 75%,
            #000000 100%
        );

    font-family:
        Arial,
        sans-serif;
}

canvas {

    display: block;

    width: 100%;
    height: 100%;
}

#hud {

    position: fixed;

    left: 50%;
    bottom: 28px;

    transform:
        translateX(-50%);

    color: #00dfff;

    font-size: 15px;

    letter-spacing: 5px;

    text-align: center;

    white-space: nowrap;

    pointer-events: none;

    text-shadow:
        0 0 5px currentColor,
        0 0 15px currentColor,
        0 0 30px currentColor;

    opacity: 0.9;

}

</style>

</head>


<body>


<div id="hud">
    TINKLE DYNAMIC CORE
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {
    EffectComposer
}
from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";

import {
    RenderPass
}
from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";

import {
    UnrealBloomPass
}
from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";



/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100
    );

camera.position.set(
    0,
    0,
    6.5
);



/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.8
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


document.body.appendChild(
    renderer.domElement
);



/* =========================================================
   BLOOM
========================================================= */

const composer =
    new EffectComposer(
        renderer
    );


const renderPass =
    new RenderPass(
        scene,
        camera
    );


composer.addPass(
    renderPass
);


const bloom =
    new UnrealBloomPass(

        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),

        1.6,

        0.65,

        0.08
    );


composer.addPass(
    bloom
);



/* =========================================================
   CORE GROUP
========================================================= */

const coreGroup =
    new THREE.Group();


scene.add(
    coreGroup
);



/* =========================================================
   SOFT CIRCULAR GLOW TEXTURE

   مهم جدًا:
   لا توجد صورة مربعة هنا.
   الأطراف شفافة تمامًا.
========================================================= */

function createGlowTexture() {

    const size = 256;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = size;
    canvas.height = size;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(

            size / 2,
            size / 2,
            0,

            size / 2,
            size / 2,
            size / 2
        );


    gradient.addColorStop(
        0.00,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.08,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.18,
        "rgba(150,245,255,0.95)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(0,220,255,0.55)"
    );

    gradient.addColorStop(
        0.55,
        "rgba(0,160,255,0.22)"
    );

    gradient.addColorStop(
        0.75,
        "rgba(0,100,255,0.06)"
    );

    gradient.addColorStop(
        1.00,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        size,
        size
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.minFilter =
        THREE.LinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    texture.generateMipmaps =
        false;


    return texture;
}


const glowTexture =
    createGlowTexture();



/* =========================================================
   CORE LIGHT
========================================================= */

const coreMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xffffff
    });


const coreSphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.22,
            48,
            48
        ),

        coreMaterial
    );


coreGroup.add(
    coreSphere
);



/* =========================================================
   HUGE SOFT CORE GLOW
========================================================= */

const coreGlowMaterial =
    new THREE.SpriteMaterial({

        map: glowTexture,

        color: 0x00dfff,

        transparent: true,

        opacity: 1,

        depthWrite: false,

        blending:
            THREE.AdditiveBlending
    });


const coreGlow =
    new THREE.Sprite(
        coreGlowMaterial
    );


coreGlow.scale.set(
    1.35,
    1.35,
    1
);


coreGroup.add(
    coreGlow
);



/* =========================================================
   SECONDARY GLOW
========================================================= */

const secondaryGlowMaterial =
    new THREE.SpriteMaterial({

        map: glowTexture,

        color: 0x00aaff,

        transparent: true,

        opacity: 0.45,

        depthWrite: false,

        blending:
            THREE.AdditiveBlending
    });


const secondaryGlow =
    new THREE.Sprite(
        secondaryGlowMaterial
    );


secondaryGlow.scale.set(
    2.7,
    2.7,
    1
);


coreGroup.add(
    secondaryGlow
);



/* =========================================================
   ORBIT SYSTEM
========================================================= */

const orbitGroup =
    new THREE.Group();


coreGroup.add(
    orbitGroup
);


const orbitData = [];


function createOrbit(
    radius,
    vertical,
    rotation
) {

    const points = [];


    const segments = 180;


    for (
        let i = 0;
        i <= segments;
        i++
    ) {

        const t =
            (i / segments) *
            Math.PI *
            2;


        /*
         * تشويه بسيط جدًا
         * حتى لا تصبح المدارات
         * دوائر هندسية مثالية.
         */

        const wobble =
            Math.sin(
                t * 3 +
                rotation.x
            ) *
            0.08;


        const r =
            radius +
            wobble;


        const x =
            Math.cos(t) *
            r;


        const y =
            Math.sin(t) *
            r *
            vertical;


        const z =
            Math.sin(
                t * 2 +
                rotation.z
            ) *
            0.12;


        points.push(
            new THREE.Vector3(
                x,
                y,
                z
            )
        );
    }


    const curve =
        new THREE.CatmullRomCurve3(
            points,
            true,
            "centripetal",
            0.25
        );


    const geometry =
        new THREE.TubeGeometry(

            curve,

            220,

            0.012,

            5,

            true
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0x00dfff,

            transparent: true,

            opacity: 0.28,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending
        });


    const orbit =
        new THREE.Mesh(
            geometry,
            material
        );


    orbit.rotation.set(
        rotation.x,
        rotation.y,
        rotation.z
    );


    orbitGroup.add(
        orbit
    );


    orbitData.push({

        mesh: orbit,

        speed:
            0.0015 +
            Math.random() * 0.003
    });
}



/* =========================================================
   CREATE DIFFERENT ORBITS
========================================================= */

createOrbit(
    1.05,
    0.55,
    {
        x: 0.2,
        y: 0.3,
        z: 0.1
    }
);


createOrbit(
    1.18,
    0.42,
    {
        x: 1.0,
        y: 0.2,
        z: 0.8
    }
);


createOrbit(
    1.30,
    0.62,
    {
        x: 1.8,
        y: 1.1,
        z: 0.3
    }
);


createOrbit(
    1.42,
    0.38,
    {
        x: 2.5,
        y: 0.6,
        z: 1.4
    }
);


createOrbit(
    1.52,
    0.55,
    {
        x: 0.8,
        y: 2.0,
        z: 2.2
    }
);


createOrbit(
    1.62,
    0.44,
    {
        x: 2.2,
        y: 2.6,
        z: 0.7
    }
);


createOrbit(
    1.72,
    0.60,
    {
        x: 1.4,
        y: 1.7,
        z: 2.8
    }
);



/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    count,
    minRadius,
    maxRadius,
    size,
    opacity
) {

    const positions =
        new Float32Array(
            count * 3
        );


    const scales =
        new Float32Array(
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const i3 =
            i * 3;


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                2 *
                Math.random() -
                1
            );


        /*
         * توزيع غير متساوٍ
         * يعطي إحساسًا طبيعيًا
         * بدل كرة هندسية.
         */

        const radius =
            minRadius +
            Math.pow(
                Math.random(),
                1.8
            ) *
            (
                maxRadius -
                minRadius
            );


        positions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        positions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);


        positions[i3 + 2] =
            radius *
            Math.cos(phi);


        scales[i] =
            0.65 +
            Math.random() *
            0.8;
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(

        "scale",

        new THREE.BufferAttribute(
            scales,
            1
        )
    );


    const material =
        new THREE.PointsMaterial({

            map: glowTexture,

            color: 0x00cfff,

            size: size,

            transparent: true,

            opacity: opacity,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            sizeAttenuation: true
        });


    const points =
        new THREE.Points(
            geometry,
            material
        );


    coreGroup.add(
        points
    );


    return points;
}



/* =========================================================
   PARTICLE LAYERS
========================================================= */

const innerParticles =
    createParticles(
        900,
        0.8,
        1.55,
        0.055,
        0.7
    );


const middleParticles =
    createParticles(
        1300,
        1.2,
        2.5,
        0.042,
        0.52
    );


const outerParticles =
    createParticles(
        800,
        2.0,
        3.4,
        0.030,
        0.30
    );



/* =========================================================
   BRIGHT PARTICLES
========================================================= */

const brightParticles =
    createParticles(
        220,
        0.9,
        2.0,
        0.085,
        0.95
    );



/* =========================================================
   PARTICLE MOTION
========================================================= */

function rotateParticles(
    particles,
    speed
) {

    particles.rotation.y +=
        speed;

    particles.rotation.x +=
        speed * 0.37;
}


function animateParticles() {

    rotateParticles(
        innerParticles,
        0.0015
    );

    rotateParticles(
        middleParticles,
        -0.0009
    );

    rotateParticles(
        outerParticles,
        0.00045
    );

    rotateParticles(
        brightParticles,
        -0.002
    );
}



/* =========================================================
   COLOR SYSTEM
========================================================= */

let currentColor =
    new THREE.Color(
        0x00dfff
    );


function setCoreColor(
    color
) {

    currentColor =
        new THREE.Color(
            color
        );


    coreGlowMaterial.color.copy(
        currentColor
    );


    secondaryGlowMaterial.color.copy(
        currentColor
    );


    for (
        const data
        of orbitData
    ) {

        data.mesh.material.color.copy(
            currentColor
        );
    }


    innerParticles.material.color.copy(
        currentColor
    );


    middleParticles.material.color.copy(
        currentColor
    );


    outerParticles.material.color.copy(
        currentColor
    );


    brightParticles.material.color.copy(
        currentColor
    );


    document.getElementById(
        "hud"
    ).style.color =
        "#" +
        currentColor.getHexString();
}



/* =========================================================
   TINKLE COLOR COMMAND
========================================================= */

window.changeTinkleColor =
function(command) {

    if (!command)
        return;


    const text =
        command.toLowerCase();


    if (
        text.includes("red") ||
        text.includes("أحمر") ||
        text.includes("احمر")
    ) {

        setCoreColor(
            0xff2020
        );
    }

    else if (
        text.includes("blue") ||
        text.includes("أزرق") ||
        text.includes("ازرق")
    ) {

        setCoreColor(
            0x00cfff
        );
    }

    else if (
        text.includes("green") ||
        text.includes("أخضر") ||
        text.includes("اخضر")
    ) {

        setCoreColor(
            0x00ff66
        );
    }

    else if (
        text.includes("purple") ||
        text.includes("بنفسجي")
    ) {

        setCoreColor(
            0xaa44ff
        );
    }

    else if (
        text.includes("pink") ||
        text.includes("وردي")
    ) {

        setCoreColor(
            0xff3399
        );
    }

    else if (
        text.includes("gold") ||
        text.includes("ذهبي")
    ) {

        setCoreColor(
            0xffaa00
        );
    }

    else if (
        text.includes("orange") ||
        text.includes("برتقالي")
    ) {

        setCoreColor(
            0xff6600
        );
    }

    else if (
        text.includes("white") ||
        text.includes("أبيض") ||
        text.includes("ابيض")
    ) {

        setCoreColor(
            0xffffff
        );
    }

    else if (
        text.includes("cyan") ||
        text.includes("سماوي")
    ) {

        setCoreColor(
            0x00ffff
        );
    }
};



/* =========================================================
   EXTERNAL MESSAGE SUPPORT
========================================================= */

window.addEventListener(
    "message",
    function(event) {

        if (!event.data)
            return;


        if (
            event.data.type ===
            "tinkle-color"
        ) {

            window.changeTinkleColor(
                event.data.color
            );
        }


        if (
            event.data.type ===
            "tinkle-command"
        ) {

            window.changeTinkleColor(
                event.data.command
            );
        }

    }
);



/* =========================================================
   MOUSE / TOUCH
========================================================= */

let dragging =
    false;


let previousX = 0;
let previousY = 0;


window.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        previousX =
            e.clientX;

        previousY =
            e.clientY;

    }
);


window.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging)
            return;


        const dx =
            e.clientX -
            previousX;


        const dy =
            e.clientY -
            previousY;


        coreGroup.rotation.y +=
            dx * 0.004;


        coreGroup.rotation.x +=
            dy * 0.004;


        previousX =
            e.clientX;


        previousY =
            e.clientY;

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


window.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);



/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /*
     * حركة بطيئة للنواة
     */

    if (!dragging) {

        coreGroup.rotation.y +=
            0.0025;

        coreGroup.rotation.z +=
            0.0007;
    }


    /*
     * تنفس النواة
     */

    const pulse =
        1 +
        Math.sin(
            time * 2.5
        ) *
        0.035;


    coreGlow.scale.set(
        1.35 * pulse,
        1.35 * pulse,
        1
    );


    secondaryGlow.scale.set(
        2.7 * pulse,
        2.7 * pulse,
        1
    );


    /*
     * حركة المدارات
     */

    for (
        const data
        of orbitData
    ) {

        data.mesh.rotation.z +=
            data.speed;

        data.mesh.rotation.x +=
            data.speed * 0.15;
    }


    animateParticles();


    composer.render();

}


animate();



/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);



/* =========================================================
   INITIAL COLOR
========================================================= */

setCoreColor(
    0x00dfff
);

</script>

</body>

</html>
