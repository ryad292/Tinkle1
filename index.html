        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement

    const coreGroup = new THREE.Group();


    // =========================================================
    // CORE
    // =========================================================

    const coreGeo =
        new THREE.SphereGeometry(
            0.42,
            32,
            32
        );

    const coreMat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const coreSphere =
        new THREE.Mesh(
            coreGeo,
            coreMat
        );

    coreGroup.add(
        coreSphere
    );


    // =========================================================
    // HALO
    // =========================================================

    const haloGeo =
        new THREE.SphereGeometry(
            0.68,
            32,
            32
        );

    const haloMat =
        new THREE.MeshBasicMaterial({
            color: 0x00cfff,
            wireframe: true,
            transparent: true,
            opacity: 0.22
        });

    const halo =
        new THREE.Mesh(
            haloGeo,
            haloMat
        );

    coreGroup.add(
        halo
    );


    // =========================================================
    // ORBITS
    // =========================================================

    const orbitMaterial =
        new THREE.LineBasicMaterial({
            color: 0x00cfff,
            transparent: true,
            opacity: 0.42
        });

    const orbits = [];

    for (let i = 0; i < 7; i++) {

        const points = [];

        const radius =
            1.25 +
            Math.random() * 0.45;

        const height =
            0.55 +
            Math.random() * 0.55;

        for (let j = 0; j <= 160; j++) {

            const t =
                (j / 160) *
                Math.PI *
                2;

            const x =
                Math.cos(t) *
                radius;

            const y =
                Math.sin(t) *
                radius *
                height;

            const z =
                Math.sin(t) *
                radius *
                0.35;

            points.push(
                new THREE.Vector3(
                    x,
                    y,
                    z
                )
            );
        }

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const orbit =
            new THREE.Line(
                geometry,
                orbitMaterial
            );

        orbit.rotation.x =
            Math.random() * Math.PI;

        orbit.rotation.y =
            Math.random() * Math.PI;

        orbit.rotation.z =
            Math.random() * Math.PI;

        coreGroup.add(
            orbit
        );

        orbits.push(
            orbit
        );
    }

            Math.PI *
            2;

        const distance =
            0.9 +
            Math.pow(
                Math.random(),
                1.8
            ) * 2.2;

        const vertical =
            (Math.random() - 0.5) *
            distance *
            0.75;

        positions[i3] =
            Math.cos(angle) *
            distance +
            (Math.random() - 0.5) *
            0.22;

        positions[i3 + 1] =
            Math.sin(angle) *
            distance *
            0.72 +
            vertical *
            0.25;

        positions[i3 + 2] =
            vertical;
    }

    particlesGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const particlesMaterial =
        new THREE.PointsMaterial({
            color: 0x00cfff,
            size: 0.035,
            transparent: true,
            opacity: 0.72
        });

    const particles =
        new THREE.Points(
            particlesGeo,
            particlesMaterial
        );

    coreGroup.add(
        particles
    );
