<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tinkle AI - JARVIS Core Interface</title>
    <style>
        body {
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .jarvis-circle {
            width: 280px;
            height: 280px;
            border: 4px dashed #00ffcc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 12s linear infinite;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.4);
            transition: all 0.5s ease;
        }
        .inner-core {
            width: 200px;
            height: 200px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            transition: all 0.5s ease;
        }
        .status-text {
            margin-top: 30px;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="jarvis-circle" id="outerCircle">
        <div class="inner-core" id="innerCore">
            <span>TINKLE AI</span>
        </div>
    </div>
    
    <div class="status-text" id="statusText">System Initialized - Yes, Doctor.</div>

    <script>
        function changeInterfaceColor(colorCode) {
            document.getElementById('outerCircle').style.borderColor = colorCode;
            document.getElementById('outerCircle').style.boxShadow = `0 0 40px ${colorCode}`;
            document.getElementById('innerCore').style.borderColor = colorCode;
            document.body.style.color = colorCode;
        }
    </script>
</body>
</html>
